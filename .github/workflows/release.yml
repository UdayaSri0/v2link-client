name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version to release, without the v prefix"
        required: true
        type: string
      release_channel:
        description: "Release channel"
        required: true
        default: stable
        type: choice
        options:
          - stable
          - prerelease
      publish_apt:
        description: "Publish the verified Debian package to the APT repository"
        required: true
        default: true
        type: boolean
      dry_run:
        description: "Build and verify without creating a tag or publishing"
        required: true
        default: true
        type: boolean
      confirmation:
        description: "Enter RELEASE when dry_run is disabled"
        required: false
        type: string

concurrency:
  group: v2link-client-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate-release:
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    outputs:
      project_version: ${{ steps.validate.outputs.project_version }}
      tag_name: ${{ steps.validate.outputs.tag_name }}
      release_notes: ${{ steps.validate.outputs.release_notes }}
      release_channel: ${{ steps.validate.outputs.release_channel }}
      release_commit: ${{ steps.validate.outputs.release_commit }}
      dry_run: ${{ steps.validate.outputs.dry_run }}
      publish_apt: ${{ steps.validate.outputs.publish_apt }}
      tag_state: ${{ steps.validate.outputs.tag_state }}
      release_state: ${{ steps.validate.outputs.release_state }}
      xray_version: ${{ steps.validate.outputs.xray_version }}
    steps:
      - name: Checkout selected commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install release validation dependencies
        run: python -m pip install "packaging>=24.0"

      - name: Validate release request and repository state
        id: validate
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version }}
          RELEASE_CHANNEL: ${{ inputs.release_channel }}
          DRY_RUN: ${{ inputs.dry_run }}
          PUBLISH_APT: ${{ inputs.publish_apt }}
          CONFIRMATION: ${{ inputs.confirmation }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          SELECTED_BRANCH: ${{ github.ref_name }}
          RELEASE_COMMIT: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${SELECTED_BRANCH}" != "${DEFAULT_BRANCH}" ]]; then
            echo "Error: releases must be run from the default branch (${DEFAULT_BRANCH}), not ${SELECTED_BRANCH}." >&2
            exit 1
          fi

          if [[ "${REQUESTED_VERSION}" == v* ]]; then
            echo "Error: enter the version without the v prefix." >&2
            exit 1
          fi

          PROJECT_VERSION="$(python - <<'PY'
          from pathlib import Path
          import tomllib
          print(tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"])
          PY
          )"

          python - "${REQUESTED_VERSION}" <<'PY'
          import sys
          from packaging.version import InvalidVersion, Version
          value = sys.argv[1]
          try:
              parsed = Version(value)
          except InvalidVersion as exc:
              raise SystemExit(f"Error: invalid release version {value!r}: {exc}")
          if str(parsed) != value:
              raise SystemExit(
                  f"Error: version must use its canonical form ({parsed}), received {value!r}."
              )
          PY

          if [[ "${REQUESTED_VERSION}" != "${PROJECT_VERSION}" ]]; then
            echo "Error: requested release version ${REQUESTED_VERSION} does not match pyproject.toml version ${PROJECT_VERSION}." >&2
            echo "Prepare and merge the version update before starting the release." >&2
            exit 1
          fi

          TAG_NAME="v${PROJECT_VERSION}"
          RELEASE_NOTES="docs/releases/${TAG_NAME}.md"
          if [[ ! -s "${RELEASE_NOTES}" ]]; then
            echo "Error: matching release notes are missing or empty: ${RELEASE_NOTES}" >&2
            exit 1
          fi
          if ! grep -Fq "v2link-client ${TAG_NAME}" "${RELEASE_NOTES}"; then
            echo "Error: ${RELEASE_NOTES} does not identify ${TAG_NAME}." >&2
            exit 1
          fi
          if ! grep -Eq "^## \[${PROJECT_VERSION//./\\.}\]([[:space:]]|$)" CHANGELOG.md; then
            echo "Error: CHANGELOG.md does not contain a release heading for ${PROJECT_VERSION}." >&2
            exit 1
          fi

          if [[ "${RELEASE_CHANNEL}" != "stable" && "${RELEASE_CHANNEL}" != "prerelease" ]]; then
            echo "Error: unsupported release channel: ${RELEASE_CHANNEL}" >&2
            exit 1
          fi
          if [[ "${DRY_RUN}" == "false" && "${CONFIRMATION}" != "RELEASE" ]]; then
            echo "Error: publication confirmation is invalid. Enter RELEASE to start a real release." >&2
            exit 1
          fi

          git fetch --tags origin
          TAG_STATE="missing"
          if git show-ref --verify --quiet "refs/tags/${TAG_NAME}"; then
            TAG_COMMIT="$(git rev-list -n 1 "${TAG_NAME}")"
            if [[ "${TAG_COMMIT}" != "${RELEASE_COMMIT}" ]]; then
              echo "Error: ${TAG_NAME} already points to ${TAG_COMMIT}, not ${RELEASE_COMMIT}. The tag will not be moved." >&2
              exit 1
            fi
            TAG_STATE="same-commit"
          fi

          RELEASE_STATE="missing"
          # The release-by-tag endpoint excludes drafts. List authenticated
          # releases so validation can safely detect resumable drafts.
          mapfile -t RELEASE_IDS < <(
            gh api --paginate "repos/${REPOSITORY}/releases?per_page=100" \
              --jq ".[] | select(.tag_name == \"${TAG_NAME}\") | .id"
          )
          RELEASE_COUNT="${#RELEASE_IDS[@]}"
          if [[ "${RELEASE_COUNT}" -gt 1 ]]; then
            echo "Error: multiple releases use tag ${TAG_NAME}; refusing ambiguous recovery." >&2
            exit 1
          fi
          if [[ "${RELEASE_COUNT}" -eq 1 ]]; then
            RELEASE_JSON="$(gh api "repos/${REPOSITORY}/releases/${RELEASE_IDS[0]}")"
            IS_DRAFT="$(jq -r '.draft' <<<"${RELEASE_JSON}")"
            TARGET_COMMITISH="$(jq -r '.target_commitish // empty' <<<"${RELEASE_JSON}")"
            if [[ "${IS_DRAFT}" != "true" ]]; then
              echo "Error: a published release already exists for ${TAG_NAME}; it will not be modified." >&2
              exit 1
            fi
            if [[ "${TAG_STATE}" != "same-commit" ]]; then
              echo "Error: a draft release exists for ${TAG_NAME}, but its tag is missing." >&2
              exit 1
            fi
            if [[ -n "${TARGET_COMMITISH}" && "${TARGET_COMMITISH}" =~ ^[0-9a-f]{40}$ && "${TARGET_COMMITISH}" != "${RELEASE_COMMIT}" ]]; then
              echo "Error: the existing draft targets another commit (${TARGET_COMMITISH})." >&2
              exit 1
            fi
            RELEASE_STATE="draft"
          fi

          XRAY_VERSION="$(python - <<'PY'
          from pathlib import Path
          import json
          print(json.loads(Path("packaging/xray-release.json").read_text(encoding="utf-8"))["version"])
          PY
          )"

          {
            echo "project_version=${PROJECT_VERSION}"
            echo "tag_name=${TAG_NAME}"
            echo "release_notes=${RELEASE_NOTES}"
            echo "release_channel=${RELEASE_CHANNEL}"
            echo "release_commit=${RELEASE_COMMIT}"
            echo "dry_run=${DRY_RUN}"
            echo "publish_apt=${PUBLISH_APT}"
            echo "tag_state=${TAG_STATE}"
            echo "release_state=${RELEASE_STATE}"
            echo "xray_version=${XRAY_VERSION}"
          } >>"${GITHUB_OUTPUT}"

  build-and-verify:
    runs-on: ubuntu-22.04
    needs: validate-release
    timeout-minutes: 45
    steps:
      - name: Checkout validated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate-release.outputs.release_commit }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            curl \
            unzip \
            file \
            dpkg-dev \
            shellcheck \
            libegl1 \
            libgl1 \
            libxkbcommon-x11-0 \
            libdbus-1-3 \
            libxcb-cursor0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -r requirements-dev.txt

      - name: Run unit tests
        run: python -m pytest -v

      - name: Run focused netmon Python tests
        run: |
          python -m pytest -v \
            tests/test_netmon_client.py \
            tests/test_diagnostics.py \
            tests/test_build_scripts.py

      - name: Run focused diagnostics privacy tests
        run: |
          python -m pytest -v \
            tests/test_logging_setup.py \
            tests/test_diagnostics.py \
            tests/test_latest_error.py \
            tests/test_safe_text_actions.py \
            tests/test_diagnostics_clipboard_ui.py \
            tests/test_latest_error_ui_integration.py

      - name: Run netmon Rust quality checks
        run: |
          cargo fmt --manifest-path netmon/Cargo.toml --all -- --check
          cargo test --manifest-path netmon/Cargo.toml --workspace --locked
          cargo clippy --manifest-path netmon/Cargo.toml --workspace --all-targets --locked -- -D warnings

      - name: Validate packaging shell scripts
        run: |
          bash -n scripts/*.sh
          bash -n packaging/deb/postinst
          bash -n packaging/deb/prerm
          bash -n packaging/deb/postrm
          bash -n packaging/deb/v2link-client-wrapper.in
          shellcheck scripts/*.sh \
            packaging/deb/postinst \
            packaging/deb/prerm \
            packaging/deb/postrm \
            packaging/deb/v2link-client-wrapper.in

      - name: Fetch and verify pinned Xray-core
        run: |
          ARCH=x86_64 ./scripts/fetch_xray_core.sh
          ARCH=x86_64 ./scripts/fetch_xray_core.sh --verify-existing

      - name: Build release artifacts
        env:
          VERSION: ${{ needs.validate-release.outputs.project_version }}
        run: ./scripts/build_release.sh

      - name: Verify final artifacts
        run: |
          ./scripts/verify_release_artifacts.sh
          cd dist
          sha256sum -c SHA256SUMS

      - name: Enforce exact artifact names
        env:
          VERSION: ${{ needs.validate-release.outputs.project_version }}
        run: |
          test -f "dist/v2link-client-${VERSION}-linux-x86_64.AppImage"
          test -f "dist/v2link-client_${VERSION}_amd64.deb"
          test -f "dist/SHA256SUMS"
          test "$(find dist -maxdepth 1 -type f -name '*.AppImage' | wc -l)" -eq 1
          test "$(find dist -maxdepth 1 -type f -name '*.deb' | wc -l)" -eq 1

      - name: Upload verified workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: v2link-client-${{ needs.validate-release.outputs.project_version }}-linux-release
          path: |
            dist/v2link-client-${{ needs.validate-release.outputs.project_version }}-linux-x86_64.AppImage
            dist/v2link-client_${{ needs.validate-release.outputs.project_version }}_amd64.deb
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 14

      - name: Write build summary
        env:
          VERSION: ${{ needs.validate-release.outputs.project_version }}
          TAG_NAME: ${{ needs.validate-release.outputs.tag_name }}
          CHANNEL: ${{ needs.validate-release.outputs.release_channel }}
          COMMIT: ${{ needs.validate-release.outputs.release_commit }}
          DRY_RUN: ${{ needs.validate-release.outputs.dry_run }}
          PUBLISH_APT: ${{ needs.validate-release.outputs.publish_apt }}
          XRAY_VERSION: ${{ needs.validate-release.outputs.xray_version }}
        run: |
          {
            echo "## Verified release build"
            echo
            echo "| Item | Value |"
            echo "|---|---|"
            echo "| Version | ${VERSION} |"
            echo "| Tag | ${TAG_NAME} |"
            echo "| Channel | ${CHANNEL} |"
            echo "| Commit | \`${COMMIT}\` |"
            echo "| Dry run | ${DRY_RUN} |"
            echo "| APT requested | ${PUBLISH_APT} |"
            echo "| Architecture | x86-64 / amd64 |"
            echo "| Bundled Xray | ${XRAY_VERSION} |"
            echo "| AppImage | \`v2link-client-${VERSION}-linux-x86_64.AppImage\` |"
            echo "| Debian | \`v2link-client_${VERSION}_amd64.deb\` |"
            echo "| Checksums | Verified |"
            if [[ "${DRY_RUN}" == "true" ]]; then
              echo
              echo "Dry run completed successfully. No tag, GitHub Release, or APT repository update was created."
            fi
          } >>"${GITHUB_STEP_SUMMARY}"

  create-draft-release:
    runs-on: ubuntu-22.04
    needs:
      - validate-release
      - build-and-verify
    if: ${{ !inputs.dry_run }}
    timeout-minutes: 15
    permissions:
      contents: write
    outputs:
      # Downstream publication reads drafts by immutable ID, never by tag.
      release_id: ${{ steps.prepare_release.outputs.release_id }}
    steps:
      - name: Checkout validated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate-release.outputs.release_commit }}
          fetch-depth: 0

      - name: Download verified workflow artifact
        uses: actions/download-artifact@v4
        with:
          name: v2link-client-${{ needs.validate-release.outputs.project_version }}-linux-release
          path: dist

      - name: Reverify artifact and release state
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ needs.validate-release.outputs.project_version }}
          TAG_NAME: ${{ needs.validate-release.outputs.tag_name }}
          RELEASE_COMMIT: ${{ needs.validate-release.outputs.release_commit }}
        run: |
          set -euo pipefail
          cd dist
          sha256sum -c SHA256SUMS
          test -f "v2link-client-${VERSION}-linux-x86_64.AppImage"
          test -f "v2link-client_${VERSION}_amd64.deb"
          cd ..

          git fetch --tags origin
          if git show-ref --verify --quiet "refs/tags/${TAG_NAME}"; then
            test "$(git rev-list -n 1 "${TAG_NAME}")" = "${RELEASE_COMMIT}" || {
              echo "Error: existing tag points to another commit." >&2
              exit 1
            }
          fi

          mapfile -t RELEASE_IDS < <(
            gh api --paginate "repos/${REPOSITORY}/releases?per_page=100" \
              --jq ".[] | select(.tag_name == \"${TAG_NAME}\") | .id"
          )
          RELEASE_COUNT="${#RELEASE_IDS[@]}"
          if [[ "${RELEASE_COUNT}" -gt 1 ]]; then
            echo "Error: multiple releases use tag ${TAG_NAME}; refusing ambiguous recovery." >&2
            exit 1
          fi
          if [[ "${RELEASE_COUNT}" -eq 1 ]]; then
            RELEASE_JSON="$(gh api "repos/${REPOSITORY}/releases/${RELEASE_IDS[0]}")"
            test "$(jq -r '.draft' <<<"${RELEASE_JSON}")" = "true" || {
              echo "Error: ${TAG_NAME} is already published." >&2
              exit 1
            }
          fi

      - name: Create tag when absent
        env:
          TAG_NAME: ${{ needs.validate-release.outputs.tag_name }}
          VERSION: ${{ needs.validate-release.outputs.project_version }}
          RELEASE_COMMIT: ${{ needs.validate-release.outputs.release_commit }}
        run: |
          set -euo pipefail
          if ! git show-ref --verify --quiet "refs/tags/${TAG_NAME}"; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git tag -a "${TAG_NAME}" "${RELEASE_COMMIT}" -m "v2link-client v${VERSION}"
            git push origin "${TAG_NAME}"
          fi

      - name: Create or resume draft release and upload exact assets
        id: prepare_release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.validate-release.outputs.project_version }}
          TAG_NAME: ${{ needs.validate-release.outputs.tag_name }}
          RELEASE_NOTES: ${{ needs.validate-release.outputs.release_notes }}
          RELEASE_COMMIT: ${{ needs.validate-release.outputs.release_commit }}
          CHANNEL: ${{ needs.validate-release.outputs.release_channel }}
        run: |
          set -euo pipefail
          mapfile -t RELEASE_IDS < <(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              --jq ".[] | select(.tag_name == \"${TAG_NAME}\") | .id"
          )
          RELEASE_COUNT="${#RELEASE_IDS[@]}"
          if [[ "${RELEASE_COUNT}" -gt 1 ]]; then
            echo "Error: multiple releases use tag ${TAG_NAME}; refusing ambiguous recovery." >&2
            exit 1
          fi
          if [[ "${RELEASE_COUNT}" -eq 0 ]]; then
            args=(
              "${TAG_NAME}"
              --draft
              --verify-tag
              --target "${RELEASE_COMMIT}"
              --title "v2link-client v${VERSION}"
              --notes-file "${RELEASE_NOTES}"
            )
            if [[ "${CHANNEL}" == "prerelease" ]]; then
              args+=(--prerelease)
            fi
            gh release create "${args[@]}"
          else
            RELEASE_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_IDS[0]}")"
            test "$(jq -r '.draft' <<<"${RELEASE_JSON}")" = "true" || {
              echo "Error: ${TAG_NAME} already identifies a published release." >&2
              exit 1
            }
            test "$(jq -r '.target_commitish' <<<"${RELEASE_JSON}")" = "${RELEASE_COMMIT}" || {
              echo "Error: existing draft targets a different commit." >&2
              exit 1
            }
          fi

          gh release upload "${TAG_NAME}" \
            "dist/v2link-client-${VERSION}-linux-x86_64.AppImage" \
            "dist/v2link-client_${VERSION}_amd64.deb" \
            "dist/SHA256SUMS" \
            --clobber

          mapfile -t RELEASE_IDS < <(
            gh api --paginate "repos/${GITHUB_REPOSITORY}/releases?per_page=100" \
              --jq ".[] | select(.tag_name == \"${TAG_NAME}\") | .id"
          )
          test "${#RELEASE_IDS[@]}" -eq 1 || {
            echo "Error: could not uniquely identify the prepared draft release." >&2
            exit 1
          }
          RELEASE_JSON="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_IDS[0]}")"
          test "$(jq -r '.draft' <<<"${RELEASE_JSON}")" = "true" || {
            echo "Error: prepared release is not a draft." >&2
            exit 1
          }
          RELEASE_ID="$(jq -r '.id' <<<"${RELEASE_JSON}")"
          [[ "${RELEASE_ID}" =~ ^[0-9]+$ ]] || {
            echo "Error: prepared draft returned an invalid release ID." >&2
            exit 1
          }
          echo "release_id=${RELEASE_ID}" >>"${GITHUB_OUTPUT}"

  publish-apt-repository:
    runs-on: ubuntu-22.04
    needs:
      - validate-release
      - create-draft-release
    if: ${{ !inputs.dry_run && inputs.publish_apt }}
    timeout-minutes: 30
    permissions:
      contents: write
    steps:
      - name: Checkout validated commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.validate-release.outputs.release_commit }}

      - name: Download verified workflow artifact
        uses: actions/download-artifact@v4
        with:
          name: v2link-client-${{ needs.validate-release.outputs.project_version }}-linux-release
          path: dist

      - name: Verify exact Debian artifact
        env:
          VERSION: ${{ needs.validate-release.outputs.project_version }}
        run: |
          cd dist
          sha256sum -c SHA256SUMS
          test -f "v2link-client_${VERSION}_amd64.deb"
          test "$(find . -maxdepth 1 -type f -name '*.deb' | wc -l)" -eq 1

      - name: Install APT repository dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y reprepro gnupg

      - name: Import APT signing key
        id: import_gpg
        uses: crazy-max/ghaction-import-gpg@v6
        with:
          gpg_private_key: ${{ secrets.APT_GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.APT_GPG_PASSPHRASE }}

      - name: Verify signing key matches apt/public.key
        env:
          SECRET_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}
        run: |
          repo_fingerprint="$(gpg --show-keys --with-colons apt/public.key | awk -F: '$1=="fpr"{print toupper($10); exit}')"
          secret_fingerprint="$(printf '%s' "${SECRET_FINGERPRINT}" | tr '[:lower:]' '[:upper:]')"
          test -n "${repo_fingerprint}" || {
            echo "Error: could not read fingerprint from apt/public.key." >&2
            exit 1
          }
          if [[ "${repo_fingerprint}" != "${secret_fingerprint}" ]]; then
            echo "Error: apt/public.key does not match the configured signing key." >&2
            exit 1
          fi

      - name: Build signed APT repository
        env:
          APT_GPG_KEY_ID: ${{ steps.import_gpg.outputs.fingerprint }}
        run: |
          ./scripts/apt_repo_build.sh \
            --dist-dir dist \
            --repo-dir public/apt \
            --codename stable \
            --component main

      - name: Publish APT repository to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./public
          enable_jekyll: false

  publish-release:
    runs-on: ubuntu-22.04
    needs:
      - validate-release
      - create-draft-release
      - publish-apt-repository
    if: >-
      ${{
        always() &&
        !inputs.dry_run &&
        needs.create-draft-release.result == 'success' &&
        (
          needs.publish-apt-repository.result == 'success' ||
          (!inputs.publish_apt && needs.publish-apt-repository.result == 'skipped')
        )
      }}
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Verify and publish draft release
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ needs.validate-release.outputs.project_version }}
          TAG_NAME: ${{ needs.validate-release.outputs.tag_name }}
          RELEASE_COMMIT: ${{ needs.validate-release.outputs.release_commit }}
          CHANNEL: ${{ needs.validate-release.outputs.release_channel }}
          PUBLISH_APT: ${{ needs.validate-release.outputs.publish_apt }}
          RELEASE_ID: ${{ needs.create-draft-release.outputs.release_id }}
        run: |
          set -euo pipefail
          [[ "${RELEASE_ID}" =~ ^[0-9]+$ ]] || {
            echo "Error: draft creation did not return a valid release ID." >&2
            exit 1
          }
          # GET /releases/{id} includes drafts; GET /releases/tags/{tag}
          # intentionally does not and must not be used for this step.
          RELEASE_JSON="$(gh api "repos/${REPOSITORY}/releases/${RELEASE_ID}")"

          test "$(jq -r '.id' <<<"${RELEASE_JSON}")" = "${RELEASE_ID}" || {
            echo "Error: fetched release ID does not match the prepared draft." >&2
            exit 1
          }
          test "$(jq -r '.tag_name' <<<"${RELEASE_JSON}")" = "${TAG_NAME}" || {
            echo "Error: draft tag does not match ${TAG_NAME}." >&2
            exit 1
          }
          test "$(jq -r '.name' <<<"${RELEASE_JSON}")" = "v2link-client v${VERSION}" || {
            echo "Error: draft title does not match version ${VERSION}." >&2
            exit 1
          }
          test "$(jq -r '.target_commitish' <<<"${RELEASE_JSON}")" = "${RELEASE_COMMIT}" || {
            echo "Error: draft does not target the validated commit." >&2
            exit 1
          }

          EXPECTED_PRERELEASE=false
          if [[ "${CHANNEL}" == "prerelease" ]]; then
            EXPECTED_PRERELEASE=true
          fi
          test "$(jq -r '.prerelease' <<<"${RELEASE_JSON}")" = "${EXPECTED_PRERELEASE}" || {
            echo "Error: draft prerelease state does not match channel ${CHANNEL}." >&2
            exit 1
          }

          git ls-remote --exit-code --tags "https://github.com/${REPOSITORY}.git" "refs/tags/${TAG_NAME}^{}" >tag-ref
          test "$(awk '{print $1}' tag-ref)" = "${RELEASE_COMMIT}" || {
            echo "Error: release tag does not resolve to the validated commit." >&2
            exit 1
          }

          test "$(jq '.assets | length' <<<"${RELEASE_JSON}")" -eq 3 || {
            echo "Error: draft must contain exactly the three required assets." >&2
            exit 1
          }
          ASSETS="$(jq -r '.assets[].name' <<<"${RELEASE_JSON}")"
          for required in \
            "v2link-client-${VERSION}-linux-x86_64.AppImage" \
            "v2link-client_${VERSION}_amd64.deb" \
            "SHA256SUMS"; do
            grep -Fxq "${required}" <<<"${ASSETS}" || {
              echo "Error: required release asset is missing: ${required}" >&2
              exit 1
            }
          done

          VERIFY_DIR="$(mktemp -d)"
          trap 'rm -rf "${VERIFY_DIR}"' EXIT
          while IFS=$'\t' read -r asset_id asset_name asset_state asset_size; do
            [[ "${asset_id}" =~ ^[0-9]+$ ]] || {
              echo "Error: release asset ${asset_name} has an invalid ID." >&2
              exit 1
            }
            test "${asset_state}" = "uploaded" || {
              echo "Error: release asset ${asset_name} is not fully uploaded." >&2
              exit 1
            }
            [[ "${asset_size}" =~ ^[1-9][0-9]*$ ]] || {
              echo "Error: release asset ${asset_name} is empty." >&2
              exit 1
            }
            gh api "repos/${REPOSITORY}/releases/assets/${asset_id}" \
              -H "Accept: application/octet-stream" >"${VERIFY_DIR}/${asset_name}"
          done < <(jq -r '.assets[] | [.id, .name, .state, .size] | @tsv' <<<"${RELEASE_JSON}")

          cd "${VERIFY_DIR}"
          CHECKSUM_NAMES="$(awk '{name=$2; sub(/^\.\//, "", name); print name}' SHA256SUMS | sort)"
          EXPECTED_CHECKSUM_NAMES="$(printf '%s\n' \
            "v2link-client-${VERSION}-linux-x86_64.AppImage" \
            "v2link-client_${VERSION}_amd64.deb" | sort)"
          test "${CHECKSUM_NAMES}" = "${EXPECTED_CHECKSUM_NAMES}" || {
            echo "Error: SHA256SUMS does not contain exactly the required binaries." >&2
            exit 1
          }
          sha256sum -c SHA256SUMS

          IS_DRAFT="$(jq -r '.draft' <<<"${RELEASE_JSON}")"
          if [[ "${IS_DRAFT}" == "false" ]]; then
            echo "Release ${TAG_NAME} is already public and passed all validation; no update is needed."
          elif [[ "${IS_DRAFT}" == "true" ]]; then
            gh api --method PATCH "repos/${REPOSITORY}/releases/${RELEASE_ID}" \
              -F draft=false \
              -F prerelease="${EXPECTED_PRERELEASE}" >/dev/null
          else
            echo "Error: release draft state is invalid: ${IS_DRAFT}." >&2
            exit 1
          fi

          {
            echo "## Release published"
            echo
            echo "- Version: ${VERSION}"
            echo "- Tag: ${TAG_NAME}"
            echo "- Commit: \`${RELEASE_COMMIT}\`"
            echo "- Channel: ${CHANNEL}"
            echo "- GitHub Release: published"
            echo "- APT repository: $([[ "${PUBLISH_APT}" == "true" ]] && echo published || echo intentionally skipped)"
            echo "- Checksums: verified before draft creation"
          } >>"${GITHUB_STEP_SUMMARY}"
