name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python validation
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Run full Python suite
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONPATH: src
        run: python -m pytest -q

      - name: Run bundled Xray integration tests
        env:
          QT_QPA_PLATFORM: offscreen
          PYTHONPATH: src
        run: python -m pytest -q tests/test_xray_tls_integration.py

      - name: Compile Python sources
        run: python -m compileall -q src tests

  rust:
    name: Rust netmon validation
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable

      - name: Check Rust formatting
        run: cargo fmt --manifest-path netmon/Cargo.toml --all -- --check

      - name: Run Rust workspace tests
        run: cargo test --manifest-path netmon/Cargo.toml --workspace --locked

      - name: Run Rust Clippy
        run: cargo clippy --manifest-path netmon/Cargo.toml --workspace --all-targets --locked -- -D warnings

  packaging:
    name: Shell and package validation
    runs-on: ubuntu-22.04
    timeout-minutes: 50
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install packaging dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            curl \
            dpkg-dev \
            file \
            libdbus-1-3 \
            libegl1 \
            libgl1 \
            libxcb-cursor0 \
            libxkbcommon-x11-0 \
            shellcheck \
            unzip
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-dev.txt

      - name: Check shell syntax and ShellCheck
        run: |
          bash -n scripts/*.sh
          bash -n packaging/deb/postinst packaging/deb/prerm packaging/deb/postrm
          bash -n packaging/deb/v2link-client-wrapper.in
          shellcheck scripts/*.sh packaging/deb/postinst packaging/deb/prerm packaging/deb/postrm packaging/deb/v2link-client-wrapper.in

      - name: Build and verify release artifacts
        env:
          VERSION: "0.2.4"
          ARCH: x86_64
        run: ./scripts/build_release.sh

      - name: Independently verify artifact names and checksums
        run: |
          ./scripts/verify_release_artifacts.sh
          test "$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')" = "0.2.4"
          test -f dist/v2link-client-0.2.4-linux-x86_64.AppImage
          test -f dist/v2link-client_0.2.4_amd64.deb
          test "$(dpkg-deb -f dist/v2link-client_0.2.4_amd64.deb Version)" = "0.2.4"
          test "$(dpkg-deb -f dist/v2link-client_0.2.4_amd64.deb Architecture)" = amd64
          grep -Fq "v26.3.27" packaging/xray-release.json
          sha256sum -c dist/SHA256SUMS

      - name: Upload temporary CI artifacts
        uses: actions/upload-artifact@v4
        with:
          name: v2link-client-0.2.4-ci-artifacts
          path: |
            dist/v2link-client-0.2.4-linux-x86_64.AppImage
            dist/v2link-client_0.2.4_amd64.deb
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 3
